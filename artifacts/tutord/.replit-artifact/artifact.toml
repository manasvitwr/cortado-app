kind = "web"
previewPath = "/"
title = "Tutord"
description = "A dark, mobile-first learning library for saving, reviewing, annotating, and organizing YouTube tutorials and playlists."
version = "1.0.0"
id = "artifacts/tutord"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22694

[services.development]
run = "pnpm --filter @workspace/tutord run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tutord", "run", "build" ]
serve = "static"
publicDir = "artifacts/tutord/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22694"
BASE_PATH = "/"
